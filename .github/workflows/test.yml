---
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 5.2.0minus39
      - ox9-testing
  pull_request:
  schedule:
    - cron: "30 0 * * *"

# For info on the OS versions, architecture, etc., see
# https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories

jobs:
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:bookworm]
        os: [warp-ubuntu-latest-x64-8x, warp-ubuntu-latest-arm64-8x]
        include:
          - image: archlinux:latest
            os: warp-ubuntu-latest-x64-8x
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Check OS info
        run: |
          uname -a

      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Run Test OxCaml action
        uses: ./.github/actions/test-oxcaml
        with:
          opam-disable-sandboxing: true
          additional-test-packages: ${{ matrix.image != 'archlinux:latest' && 'binaryen-bin' || '' }} strace_ui proctopus

  test-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Run Test OxCaml action
        uses: ./.github/actions/test-oxcaml
